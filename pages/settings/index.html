<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>弥亚开发工具箱</title>
<link rel="stylesheet" href="./styles.css?v=20260618_groups_layout">
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>群聊权限配置</h2>
    <p>默认配置置顶，群配置可单独覆盖</p>
  </div>
  <div class="group-list" id="groupList">
    <!-- JS 动态填充 -->
  </div>
</div>

<div class="main-content" id="mainContent">
  <div class="top-actions">
    <button class="theme-toggle" id="paletteToggleBtn" type="button" title="切换主题色：金奢 / 蓝白 / 炫彩">
      <span>主题</span><b id="paletteModeLabel">金奢</b>
    </button>
  </div>
  <div class="empty-state" id="emptyState">
    <div class="icon">⚙️</div>
    <p>请选择默认配置或某个群聊</p>
  </div>
  <div class="config-panel" id="configPanel" style="display:none">
    <!-- JS 动态填充 -->
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="confirm-mask" id="confirmMask">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">确认操作</div>
    <div class="confirm-message" id="confirmMessage"></div>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirmCancelBtn">取消</button>
      <button class="btn btn-primary" id="confirmOkBtn">确认</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js?v=20260618_groups_layout"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>弥亚工具箱</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css?v=20260924_backup_parallel" />
</head>
<body>
  <div class="startup-loader" id="startupLoader" aria-live="polite">
    <div class="startup-loader-mark" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div class="startup-loader-copy">
      <strong id="startupLoaderTitle">读取配置</strong>
    </div>
  </div>
  <div class="dashboard-shell">
    <aside class="sidebar" aria-label="配置导航">
      <section class="brand-panel">
        <img class="brand-logo" src="./brand_logo.png?v=20260619_devkit_logo_sync" alt="弥亚开发工具箱 Logo" />
        <div class="brand-copy">
          <h1>弥亚工具箱</h1>
        </div>
        <button id="refreshGroupsBtn" class="icon-button" type="button" title="刷新群聊和私聊列表" aria-label="刷新群聊和私聊列表">
          <span aria-hidden="true">↻</span>
        </button>
      </section>

      <nav class="menu-stack" aria-label="页面定位">
        <div class="menu-group">
          <button class="menu-item nav-jump" type="button" data-jump="tools"><span aria-hidden="true">☷</span>工具开关</button>
          <button class="menu-item nav-jump active" type="button" data-jump="admins"><span aria-hidden="true">◌</span>权限管理</button>
        </div>
      </nav>

      <div class="group-list" id="groupList"></div>
    </aside>

    <main class="dashboard-main">
      <header class="topbar">
        <label class="search-box" for="dashboardSearch">
          <span aria-hidden="true">⌕</span>
          <input id="dashboardSearch" type="search" placeholder="搜索工具、分组或配置对象..." autocomplete="off" />
        </label>
        <div class="top-actions">
          <button id="paletteToggleBtn" class="toolbar-button" type="button" title="切换配色" aria-label="切换配色">
            <span>配色：</span><b id="paletteModeLabel">石墨</b>
          </button>
          <button id="appearanceToggleBtn" class="toolbar-button" type="button" title="切换主题" aria-label="切换主题">
            <span>主题：</span><b id="appearanceModeLabel">自动</b>
          </button>
          <button id="soundFeedbackBtn" class="toolbar-button" type="button" title="音效：开" aria-label="音效：开" aria-pressed="true">
            <span>音效：</span><b id="soundFeedbackLabel">开</b>
          </button>
        </div>
      </header>

      <section class="empty-state" id="emptyState">
        <div class="empty-card">
          <div class="empty-mark">IR</div>
          <h2>选择配置对象</h2>
          <p>从左侧选择全局、群聊或私聊。</p>
        </div>
      </section>

      <section class="config-panel" id="configPanel" style="display:none"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="confirm-mask" id="confirmMask">
    <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="confirm-title" id="confirmTitle">确认操作</div>
      <div class="confirm-message" id="confirmMessage"></div>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="confirmCancelBtn" type="button">取消</button>
        <button class="btn btn-primary" id="confirmOkBtn" type="button">确认</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js?v=20260924_nav_palette"></script>
</body>
</html>
